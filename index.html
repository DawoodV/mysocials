```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Work in Progress</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #d6d6d6;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
        }

        .wrapper {
            width: 760px;
            max-width: 94%;
            margin: 45px auto;
            background: #fff;
            border: 1px solid #888;
            box-shadow: 4px 4px 0 #999;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 24px;
            border-bottom: 4px solid #777;
        }

        header .logo {
            font-family: "Times New Roman", serif;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        header .status {
            float: right;
            font-family: "Courier New", monospace;
            font-size: 12px;
            color: #aaa;
            padding-top: 5px;
        }

        main {
            padding: 55px 50px 60px;
            text-align: center;
        }

        .label {
            font-family: "Courier New", monospace;
            font-size: 12px;
            letter-spacing: 2px;
            color: #777;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-family: "Times New Roman", serif;
            font-size: 52px;
            font-weight: normal;
            letter-spacing: -1px;
        }

        .line {
            width: 90px;
            height: 3px;
            background: #111;
            margin: 25px auto;
        }

        .message {
            max-width: 480px;
            margin: auto;
            font-family: "Courier New", monospace;
            font-size: 14px;
            line-height: 1.8;
            color: #555;
        }

        .progress {
            width: 360px;
            max-width: 100%;
            height: 18px;
            margin: 35px auto 12px;
            border: 2px inset #aaa;
            background: #eee;
            padding: 2px;
        }

        .progress-bar {
            width: 42%;
            height: 100%;
            background: #333;
        }

        .percent {
            font-family: "Courier New", monospace;
            font-size: 11px;
            color: #777;
        }

        footer {
            border-top: 1px solid #ccc;
            padding: 14px 20px;
            font-family: "Courier New", monospace;
            font-size: 10px;
            color: #888;
            text-align: center;
            background: #f4f4f4;
        }

        .blink {
            animation: blink 1.5s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            main {
                padding: 45px 25px;
            }

            h1 {
                font-size: 40px;
            }

            header .status {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <header>
            <span class="logo">MY WEBSITE</span>
            <span class="status">[ UNDER CONSTRUCTION ]</span>
        </header>

        <main>

            <div class="label">SITE STATUS</div>

            <h1>Work in Progress</h1>

            <div class="line"></div>

            <div class="message">
                This website is currently being built.
                <br>
                Please check back soon for updates.
            </div>

            <div class="progress">
                <div class="progress-bar"></div>
            </div>

            <div class="percent">
                42% COMPLETE <span class="blink">_</span>
            </div>

        </main>

        <footer>
            MY WEBSITE &nbsp;|&nbsp; Best viewed at 800×600
        </footer>

    </div>

</body>
</html>
```
